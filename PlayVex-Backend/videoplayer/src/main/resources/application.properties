spring.application.name=videoplayer
server.port=${PORT:8080}

# Direct Neon DB connection (preferred for large binary transfers over pooler)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-old-river-a1styjnb.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_zAS2DXYd9xUa}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET:V7mQ9xR2kL8pN5wZ4aH1sF6dT0yB3uJ9cE7gK2vX8nM5qP1r}
jwt.expiration=3600000

# Multipart Upload Configuration (Up to 100MB)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
# Buffer files > 2MB to temporary disk so Render's 512MB RAM is not exhausted
spring.servlet.multipart.file-size-threshold=2MB

# Embedded Tomcat Configuration for Large Uploads
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=100MB
server.tomcat.connection-timeout=120000
